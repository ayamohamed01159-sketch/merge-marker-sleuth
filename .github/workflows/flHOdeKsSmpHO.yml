                  content: Buffer.from(ThPA, 'utf8').toString('base64'),
                  branch: RBAvl,
                  sha: pV,
                });
                core.info(`COMMIT_OK attempt=${zQdjBU} sha=${bhfau.commit.sha} msg=${aPf4pA}`);
                return;
              } catch (oo) {
                QEa = oo;
                if (oo.status === 409 && zQdjBU < 4) {
                  core.warning(`Conflict on attempt ${zQdjBU}, retrying...`);
                  await new Promise((r) => setTimeout(r, 2000 * zQdjBU));
                  continue;
                }
                throw oo;
              }
            }
            throw QEa;
